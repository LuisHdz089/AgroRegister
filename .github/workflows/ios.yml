
name: Compilar VacaTec para iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Compilar aplicación iOS
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Verificar Flutter
        run: flutter doctor -v

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar para iOS
        run: flutter build ios --release --no-codesign

      - name: Guardar aplicación compilada
        uses: actions/upload-artifact@v4
        with:
          name: VacaTec-iOS
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

      - name: Crear archivo IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry VacaTec.ipa Payload

      - name: Guardar archivo IPA
        uses: actions/upload-artifact@v4
        with:
          name: VacaTec-IPA
          path: VacaTec.ipa
          if-no-files-found: error

